site_name: OpenMCP Documentation
site_url: https://openmcp.org
repo_url: https://github.com/azlanabdulla/OpenMCP
repo_name: azlanabdulla/OpenMCP

theme:
  name: material
  palette:
    - scheme: slate
      primary: black
      accent: cyan

nav:
  - Introduction: index.md
  - Getting Started: getting-started.md
  - API Reference: api.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
