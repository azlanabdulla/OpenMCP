name: OpenMCP CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: openmcp
          POSTGRES_PASSWORD: openmcp_password
          POSTGRES_DB: openmcp_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff pytest httpx
        pip install -r backend/requirements.txt
        pip install -r cli/requirements.txt
        
    - name: Lint and Test Backend
      run: |
        ruff check backend/app
        pytest backend/tests
      
    - name: Lint and Test CLI
      run: |
        ruff check cli/openmcp
        pytest cli/tests
      
    - name: Test SDK build and runtime
      run: |
        cd sdk
        pip install .
        pytest tests
