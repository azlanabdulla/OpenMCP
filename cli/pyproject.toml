[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openmcp-cli"
version = "0.1.0"
description = "Command line interface for OpenMCP."
requires-python = ">=3.9"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.4.0",
    "httpx>=0.24.1",
    "pydantic>=2.0.0"
]

[project.scripts]
openmcp = "openmcp.main:app"
